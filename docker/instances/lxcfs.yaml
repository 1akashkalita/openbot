# Added to compose.yaml by `openbot-instance` when LXCFS runs on the host (see lxcfs_ready). LXCFS
# shows the limits of the container in these files: with --enable-cfs, /proc/cpuinfo and /proc/stat
# list as many CPUs as the CPU limit, and /proc/meminfo shows the memory limit. Without them, a
# program in the container sees the 64 CPUs of the host, and a build tool such as Next.js starts a
# worker for each. See docs/docker.md#cpu-and-memory-of-the-instances.
services:
  openbot:
    volumes:
      - /var/lib/lxcfs/proc/cpuinfo:/proc/cpuinfo:ro
      - /var/lib/lxcfs/proc/stat:/proc/stat:ro
      - /var/lib/lxcfs/proc/meminfo:/proc/meminfo:ro
      - /var/lib/lxcfs/proc/swaps:/proc/swaps:ro
      # glibc's sysconf(_SC_NPROCESSORS_ONLN), and so Python's os.cpu_count(), reads this file first.
      - /var/lib/lxcfs/sys/devices/system/cpu/online:/sys/devices/system/cpu/online:ro
