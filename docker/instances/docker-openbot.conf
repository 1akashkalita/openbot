# Docker starts the OpenBot containers when it starts. `openbot-instance setup` installs this file as
# /etc/systemd/system/docker.service.d/openbot.conf.
[Unit]
# No container starts without its firewall: when openbot-firewall fails, Docker does not start.
Requires=openbot-firewall.service
After=openbot-firewall.service
# A container with the syslog log driver does not start without the rsyslog socket.
Wants=rsyslog.service
After=rsyslog.service
